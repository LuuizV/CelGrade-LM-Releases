name: Publicar CelGrade LM 0.9.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-celgrade-0.9.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Obter codigo-fonte da versao 0.9.7
        uses: actions/checkout@v4
        with:
          repository: LuuizV/CelGrade-LM
          ref: dd6db8e90ec4d79120f7efe202461c676810664f
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar instalador Windows
        run: npm run package:win

      - name: Conferir arquivos do atualizador
        shell: pwsh
        run: |
          $files = @(
            "release/CelGrade-LM-Setup-0.9.7.exe",
            "release/CelGrade-LM-Setup-0.9.7.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Arquivo obrigatorio ausente: $file"
            }
          }

      - name: Publicar release estavel no repositorio de distribuicao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: LuuizV/CelGrade-LM-Releases
        run: |
          gh release create v0.9.7 `
            "release/CelGrade-LM-Setup-0.9.7.exe" `
            "release/CelGrade-LM-Setup-0.9.7.exe.blockmap" `
            "release/latest.yml" `
            --repo "$env:GH_REPO" `
            --title "CelGrade LM 0.9.7" `
            --notes "CelGrade LM 0.9.7: identidade do jasmim original na barra lateral e no topo, icone Windows corrigido sem rebarbas, barra de indicadores compacta, avisos sob geracao e aulas travadas com destaque. Preserva dados e funcionalidades." `
            --latest
