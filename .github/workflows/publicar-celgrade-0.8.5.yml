name: Publicar CelGrade LM 0.8.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-celgrade-0.8.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Obter codigo-fonte da versao 0.8.5
        uses: actions/checkout@v4
        with:
          repository: LuuizV/CelGrade-LM
          ref: ace5b18f0ce8090756cc4cc6a356f61897e7f7ff
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar instalador Windows
        run: npm run package:win

      - name: Conferir arquivos do atualizador
        shell: pwsh
        run: |
          $files = @(
            "release/CelGrade-LM-Setup-0.8.5.exe",
            "release/CelGrade-LM-Setup-0.8.5.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Arquivo obrigatorio ausente: $file"
            }
          }

      - name: Publicar release estavel no repositorio de distribuicao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: LuuizV/CelGrade-LM-Releases
        run: |
          gh release create v0.8.5 `
            "release/CelGrade-LM-Setup-0.8.5.exe" `
            "release/CelGrade-LM-Setup-0.8.5.exe.blockmap" `
            "release/latest.yml" `
            --repo "$env:GH_REPO" `
            --title "CelGrade LM 0.8.5" `
            --notes "Mensagens curtas e claras para formandos com disciplinas em conflito, e cartao de arraste integrado sem sobreposicao. Dados existentes preservados." `
            --latest
