name: Publicar CelGrade LM 0.8.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-celgrade-0.8.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Obter codigo-fonte da versao 0.8.3
        uses: actions/checkout@v4
        with:
          repository: LuuizV/CelGrade-LM
          ref: b0ebdf24443cb5e0c038669355924f3d13a7cfab
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar instalador Windows
        run: npm run package:win

      - name: Conferir arquivos do atualizador
        shell: pwsh
        run: |
          $files = @(
            "release/CelGrade-LM-Setup-0.8.3.exe",
            "release/CelGrade-LM-Setup-0.8.3.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Arquivo obrigatorio ausente: $file"
            }
          }

      - name: Publicar release estavel no repositorio de distribuicao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: LuuizV/CelGrade-LM-Releases
        run: |
          gh release create v0.8.3 `
            "release/CelGrade-LM-Setup-0.8.3.exe" `
            "release/CelGrade-LM-Setup-0.8.3.exe.blockmap" `
            "release/latest.yml" `
            --repo "$env:GH_REPO" `
            --title "CelGrade LM 0.8.3" `
            --notes "Corrigidos estados dos icones na navegacao; cadeados SVG uniformes e animados; mensagens explicativas de erros e dicas de movimento proximas ao cursor. Dados e regras academicas preservados." `
            --latest
