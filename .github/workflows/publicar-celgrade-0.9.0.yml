name: Publicar CelGrade LM 0.9.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-celgrade-0.9.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Obter codigo-fonte da versao 0.9.0
        uses: actions/checkout@v4
        with:
          repository: LuuizV/CelGrade-LM
          ref: c961beb952cd84193fe12f53ac61949de4147687
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar instalador Windows
        run: npm run package:win

      - name: Conferir arquivos do atualizador
        shell: pwsh
        run: |
          $files = @(
            "release/CelGrade-LM-Setup-0.9.0.exe",
            "release/CelGrade-LM-Setup-0.9.0.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Arquivo obrigatorio ausente: $file"
            }
          }

      - name: Publicar release estavel no repositorio de distribuicao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: LuuizV/CelGrade-LM-Releases
        run: |
          gh release create v0.9.0 `
            "release/CelGrade-LM-Setup-0.9.0.exe" `
            "release/CelGrade-LM-Setup-0.9.0.exe.blockmap" `
            "release/latest.yml" `
            --repo "$env:GH_REPO" `
            --title "CelGrade LM 0.9.0" `
            --notes "CelGrade LM 0.9.0: novo PDF academico A4 com cores, professor e sala; sem repeticao de titulo ou 'dupla'. Notificacoes temporarias, mensagens de conflitos mais claras, alternativas com cores e nomes com periodo, controles por turma, excluir alternativa e aulas a tarde preparadas visualmente, mas desativadas. Dados existentes preservados." `
            --latest
