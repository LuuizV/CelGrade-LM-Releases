name: Publicar CelGrade LM 0.9.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-celgrade-0.9.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Obter codigo-fonte da versao 0.9.1
        uses: actions/checkout@v4
        with:
          repository: LuuizV/CelGrade-LM
          ref: 8ce4333d5b201b40aced104cc923f801e24deb1c
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar instalador Windows
        run: npm run package:win

      - name: Conferir arquivos do atualizador
        shell: pwsh
        run: |
          $files = @(
            "release/CelGrade-LM-Setup-0.9.1.exe",
            "release/CelGrade-LM-Setup-0.9.1.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Arquivo obrigatorio ausente: $file"
            }
          }

      - name: Publicar release estavel no repositorio de distribuicao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: LuuizV/CelGrade-LM-Releases
        run: |
          gh release create v0.9.1 `
            "release/CelGrade-LM-Setup-0.9.1.exe" `
            "release/CelGrade-LM-Setup-0.9.1.exe.blockmap" `
            "release/latest.yml" `
            --repo "$env:GH_REPO" `
            --title "CelGrade LM 0.9.1" `
            --notes "PDF corrigido: pagina totalmente branca, cartoes coloridos maiores, aulas exibidas individualmente em cada horario, sem o rotulo dupla. Todas as demais melhorias da versao 0.9.0 preservadas." `
            --latest
